<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Click Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 text-center max-w-sm w-full shadow-2xl">
    <h1 class="text-lg font-bold mb-2">JavaScript Test</h1>
    <p class="text-xs text-slate-400 mb-6">Tap the button below to test if tap events are firing on your mobile browser.</p>
    
    <button onclick="testClick()" class="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm rounded-xl transition shadow-lg">
      TAP TO TEST
    </button>
  </div>

  <script>
    function testClick() {
      alert("Click event works perfectly!");
    }
  </script>

</body>
</html>
