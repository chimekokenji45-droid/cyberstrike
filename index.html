<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberstrike Arena</title>
  
  <!-- External CDNs -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
  
</head>
<body class="bg-slate-950 text-white min-h-screen selection:bg-cyan-500/30">

  <!-- ========================================== -->
  <!-- 1. LOGIN GATE                              -->
  <!-- ========================================== -->
  <div id="authGate" class="flex flex-col items-center justify-center min-h-screen p-4">
    <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-[0_0_40px_rgba(6,182,212,0.1)] w-full max-w-md">
      <h2 class="text-3xl font-bold text-center mb-6 text-cyan-400 tracking-wider">CYBERSTRIKE</h2>
      
      <div id="authMessage" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/50 text-red-400 text-xs rounded-lg text-center tracking-wide"></div>

      <div class="space-y-5">
        <div>
          <label class="block text-slate-400 text-[10px] mb-1 tracking-widest">PLAYER EMAIL</label>
          <input type="email" id="loginEmail" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-cyan-500 outline-none transition" placeholder="Enter email">
        </div>
        
        <div>
          <label class="block text-slate-400 text-[10px] mb-1 tracking-widest">PASSWORD</label>
          <input type="password" id="loginPassword" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-cyan-500 outline-none transition" placeholder="••••••••">
        </div>

        <button type="button" id="loginButton" onclick="handleLogin()" class="w-full mt-2 bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold py-3 rounded-lg transition shadow-[0_0_15px_rgba(6,182,212,0.4)]">
          LOGIN / ENTER ARENA
        </button>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 2. MAIN APPLICATION INTERFACE (HIDDEN)     -->
  <!-- ========================================== -->
  <div id="appContainer" class="hidden max-w-4xl mx-auto p-4 pb-20">
    
    <!-- Header -->
    <header class="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-xl mb-6">
      <div>
        <div class="text-[10px] text-slate-400 tracking-widest">BALANCE</div>
        <div class="text-2xl font-bold text-emerald-400">$<span id="userBalanceDisplay">0.00</span></div>
      </div>
      <div class="flex gap-2">
        <button onclick="openModal('depositModal')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg text-xs transition">DEPOSIT</button>
        <button onclick="openModal('withdrawModal')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg text-xs transition">WITHDRAW</button>
        <button onclick="logout()" class="px-4 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg text-xs transition">LOGOUT</button>
      </div>
    </header>

    <!-- Game Arena -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 mb-6 relative overflow-hidden flex flex-col items-center">
      <h3 class="text-center text-cyan-500 tracking-widest mb-4">PENALTY SHOOTOUT</h3>
      
      <div class="flex justify-center gap-4 mb-6">
        <button id="stakeTier-0.5" onclick="selectStakeTier(0.50)" class="px-6 py-2 border rounded-lg transition text-sm">0.50 USDT</button>
        <button id="stakeTier-1.0" onclick="selectStakeTier(1.00)" class="px-6 py-2 border rounded-lg transition text-sm">1.00 USDT</button>
        <button id="stakeTier-5.0" onclick="selectStakeTier(5.00)" class="px-6 py-2 border rounded-lg transition text-sm">5.00 USDT</button>
      </div>

      <div class="relative w-full max-w-[600px] aspect-[6/4] bg-slate-950 border-2 border-slate-800 rounded-lg overflow-hidden">
        <canvas id="gameCanvas" width="600" height="400" class="w-full h-full block"></canvas>
        
        <div id="canvasOverlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center z-10">
          <p id="matchOverlayDesc" class="text-slate-300 text-xs mb-4 text-center px-4"></p>
          <button onclick="startMatchmaking()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-900 px-8 py-3 font-bold rounded-lg transition shadow-[0_0_20px_rgba(6,182,212,0.3)]">
            FIND MATCH
          </button>
        </div>
      </div>
    </div>

    <!-- Weekly Sprint Progress -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
      <div class="flex justify-between items-end mb-4">
        <div>
          <h3 class="text-cyan-500 tracking-widest">WEEKLY SPRINT</h3>
          <p class="text-xs text-slate-400 mt-1">Ends in: <span id="sprintCountdown" class="text-white">--:--:--</span></p>
        </div>
        <div class="text-right">
          <div class="text-[10px] text-slate-400 tracking-widest">TOTAL WINS</div>
          <div class="text-xl font-bold text-white"><span id="sprintWinsDisplay">0</span></div>
        </div>
      </div>

      <div class="w-full h-2 bg-slate-950 rounded-full mb-2 overflow-hidden border border-slate-800">
        <div id="sprintProgressBar" class="h-full bg-cyan-500 shadow-[0_0_10px_rgba(6,182,212,0.8)] transition-all duration-500" style="width: 0%"></div>
      </div>
      <p id="nextRewardLabel" class="text-right text-[10px] text-cyan-400 mb-6">NEXT REWARD: -- USDT</p>

      <div class="grid grid-cols-4 gap-2">
        <button id="claim20Btn" onclick="claimMilestone(20, 2.00)"></button>
        <button id="claim50Btn" onclick="claimMilestone(50, 5.00)"></button>
        <button id="claim100Btn" onclick="claimMilestone(100, 10.00)"></button>
        <button id="claim1000Btn" onclick="claimMilestone(1000, 100.00)"></button>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 3. MODALS                                  -->
  <!-- ========================================== -->
  
  <!-- Alert Modal -->
  <div id="cyberAlertModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border-2 border-cyan-500 p-6 rounded-xl text-center max-w-sm w-full shadow-[0_0_30px_rgba(6,182,212,0.2)]">
      <h2 id="cyberAlertTitle" class="text-cyan-400 font-bold text-xl mb-2">ALERT</h2>
      <p id="cyberAlertMessage" class="text-slate-300 text-sm mb-6"></p>
      <button onclick="closeModal('cyberAlertModal')" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-2 rounded-lg border border-slate-600 transition">ACKNOWLEDGE</button>
    </div>
  </div>

  <!-- Deposit Modal -->
  <div id="depositModal" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-slate-950/90 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-slate-700 p-6 rounded-xl max-w-md w-full">
      <h2 class="text-xl font-bold text-emerald-400 mb-4">DEPOSIT FUNDS</h2>
      <input type="hidden" id="depositUserId">
      <label class="block text-slate-400 text-xs mb-2">AMOUNT (USDT)</label>
      <input type="number" id="depositAmount" step="0.5" min="0.5" value="5.0" oninput="updateDepositDisplay()" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white mb-6">
      <div class="flex gap-4">
        <button onclick="closeModal('depositModal')" class="flex-1 py-3 bg-slate-800 rounded-lg text-sm transition">CANCEL</button>
        <button onclick="initiateFaucetPayDeposit()" class="flex-1 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold rounded-lg transition shadow-[0_0_15px_rgba(16,185,129,0.3)]">PAY <span id="depositAmountDisplay">5.00 USDT</span></button>
      </div>
    </div>
  </div>

  <!-- Withdraw Modal -->
  <div id="withdrawModal" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-slate-950/90 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-slate-700 p-6 rounded-xl max-w-md w-full">
      <h2 class="text-xl font-bold text-cyan-400 mb-4">WITHDRAW FUNDS</h2>
      <div class="mb-4">
        <div class="text-xs text-slate-400">AVAILABLE BALANCE</div>
        <div class="text-lg text-white" id="withdrawBalanceDisplay">0.00 USDT</div>
      </div>
      <label class="block text-slate-400 text-xs mb-2">FAUCETPAY EMAIL</label>
      <input type="email" id="withdrawEmail" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white mb-4" disabled>
      <label class="block text-slate-400 text-xs mb-2">AMOUNT TO WITHDRAW</label>
      <input type="number" id="withdrawAmount" step="0.5" min="0.5" placeholder="0.00" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white mb-6">
      <div class="flex gap-4">
        <button onclick="closeModal('withdrawModal')" class="flex-1 py-3 bg-slate-800 rounded-lg text-sm transition">CANCEL</button>
        <button onclick="confirmWithdrawal()" class="flex-1 py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold rounded-lg transition shadow-[0_0_15px_rgba(6,182,212,0.3)]">WITHDRAW</button>
      </div>
    </div>
  </div>

  <!-- Main JavaScript File -->
  <script src="script.js"></script>
</body>
  </html>
